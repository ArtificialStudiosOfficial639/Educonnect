<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>AuraAuth • Next-Gen Mobile Authentication</title>
  
  <!-- Modern Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- GSAP Animation Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

  <style>
    :root {
      --bg-dark: #07090e;
      --card-bg: rgba(16, 21, 33, 0.78);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent-gradient: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #ec4899 100%);
      --accent-glow: rgba(99, 102, 241, 0.35);
      --input-bg: rgba(13, 19, 31, 0.65);
      --input-border: rgba(255, 255, 255, 0.09);
      --input-focus: rgba(99, 102, 241, 0.3);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-subtle: #64748b;
      --success: #10b981;
      --warning: #f59e0b;
      --error: #f43f5e;
      --radius-full: 9999px;
      --radius-xl: 26px;
      --radius-lg: 16px;
      --radius-md: 12px;
      --radius-sm: 8px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    html, body {
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      background-color: var(--bg-dark);
      color: var(--text-main);
      overflow-x: hidden;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: env(safe-area-inset-top, 16px) env(safe-area-inset-right, 16px) env(safe-area-inset-bottom, 16px) env(safe-area-inset-left, 16px);
      position: relative;
    }

    /* Smooth Mobile Preloader Overlay */
    .preloader {
      position: fixed;
      inset: 0;
      background-color: var(--bg-dark);
      z-index: 1000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: all;
    }

    .loader-brand {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .loader-icon-wrap {
      position: relative;
      width: 68px;
      height: 68px;
      border-radius: 20px;
      background: var(--accent-gradient);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 35px var(--accent-glow);
    }

    .loader-pulse-ring {
      position: absolute;
      inset: -6px;
      border-radius: 26px;
      border: 2px solid rgba(99, 102, 241, 0.6);
      opacity: 0;
    }

    .loader-title {
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #ffffff 30%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .loader-bar-container {
      width: 140px;
      height: 4px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: var(--radius-full);
      overflow: hidden;
      margin-top: 8px;
      position: relative;
    }

    .loader-bar-fill {
      width: 0%;
      height: 100%;
      background: var(--accent-gradient);
      border-radius: var(--radius-full);
    }

    .loader-status {
      margin-top: 10px;
      font-size: 0.78rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-subtle);
    }

    /* Ambient Glow System */
    .ambient-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.45;
      transform: translate3d(0, 0, 0);
      will-change: transform;
    }

    .orb-1 {
      width: min(80vw, 420px);
      height: min(80vw, 420px);
      background: radial-gradient(circle, #6366f1, transparent 70%);
      top: -10%;
      left: -10%;
      animation: floatMobile 14s ease-in-out infinite alternate;
    }

    .orb-2 {
      width: min(90vw, 460px);
      height: min(90vw, 460px);
      background: radial-gradient(circle, #ec4899, transparent 70%);
      bottom: -12%;
      right: -10%;
      animation: floatMobile 18s ease-in-out infinite alternate-reverse;
    }

    .grid-pattern {
      position: fixed;
      inset: 0;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 32px 32px;
      z-index: 1;
      pointer-events: none;
    }

    @keyframes floatMobile {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(25px, 20px) scale(1.08); }
    }

    /* Main Card Layout */
    .auth-container {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 440px;
      margin: auto;
      opacity: 0; /* Animated by GSAP on launch */
    }

    .auth-card {
      background: var(--card-bg);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-xl);
      padding: 34px 28px;
      box-shadow: 
        0 24px 60px rgba(0, 0, 0, 0.55),
        0 0 0 1px rgba(255, 255, 255, 0.04),
        inset 0 1px 1px rgba(255, 255, 255, 0.12);
      overflow: hidden;
      position: relative;
    }

    .card-top-glow {
      position: absolute;
      top: 0;
      left: 15%;
      right: 15%;
      height: 2px;
      background: linear-gradient(90deg, transparent, #818cf8, #f472b6, transparent);
    }

    /* Brand Header */
    .brand-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 22px;
    }

    .brand-avatar {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: var(--accent-gradient);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 14px var(--accent-glow);
    }

    .brand-avatar svg {
      width: 20px;
      height: 20px;
      color: #fff;
    }

    .brand-name {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #fff;
    }

    /* Sliding Mode Toggle Switch */
    .toggle-nav {
      position: relative;
      display: flex;
      background: rgba(11, 16, 26, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: var(--radius-full);
      padding: 4px;
      margin-bottom: 24px;
    }

    .toggle-pill {
      position: absolute;
      top: 4px;
      bottom: 4px;
      left: 4px;
      width: calc(50% - 4px);
      background: var(--accent-gradient);
      border-radius: var(--radius-full);
      box-shadow: 0 2px 10px var(--accent-glow);
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 1;
    }

    .toggle-nav.mode-signup .toggle-pill {
      transform: translateX(100%);
    }

    .toggle-btn {
      position: relative;
      z-index: 2;
      flex: 1;
      border: none;
      background: transparent;
      color: var(--text-muted);
      padding: 10px 0;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      transition: color 0.25s ease;
      min-height: 44px; /* Optimal Mobile Tap Target */
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .toggle-btn.active {
      color: #ffffff;
    }

    .form-header {
      margin-bottom: 20px;
      text-align: left;
    }

    .form-title {
      font-size: 1.45rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text-main);
      margin-bottom: 4px;
    }

    .form-subtitle {
      font-size: 0.86rem;
      color: var(--text-muted);
    }

    /* Forms Viewport for zero layout jump */
    .forms-wrapper {
      position: relative;
      width: 100%;
    }

    .form-view {
      width: 100%;
    }

    .form-view.is-hidden {
      display: none;
    }

    .input-group {
      margin-bottom: 16px;
      text-align: left;
    }

    .input-label {
      display: block;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .input-field-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      width: 18px;
      height: 18px;
      stroke: var(--text-subtle);
      pointer-events: none;
      transition: stroke 0.2s ease;
    }

    .app-input {
      width: 100%;
      height: 48px; /* Comfortable mobile touch target */
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: var(--radius-md);
      padding: 0 42px 0 44px;
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
      transition: all 0.25s ease;
      -webkit-appearance: none;
    }

    .app-input::placeholder {
      color: var(--text-subtle);
      font-size: 0.9rem;
    }

    .app-input:focus {
      border-color: #818cf8;
      background: rgba(18, 25, 41, 0.9);
      box-shadow: 0 0 0 3px var(--input-focus);
    }

    .app-input:focus + .input-icon {
      stroke: #818cf8;
    }

    .eye-btn {
      position: absolute;
      right: 4px;
      width: 40px;
      height: 40px;
      background: transparent;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--text-subtle);
      transition: color 0.2s ease;
      border-radius: var(--radius-sm);
    }

    .eye-btn:active, .eye-btn:hover {
      color: var(--text-main);
    }

    .eye-btn svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
    }

    .strength-meter {
      margin-top: 6px;
      margin-bottom: 12px;
    }

    .strength-bars {
      display: flex;
      gap: 4px;
      height: 4px;
      margin-bottom: 4px;
    }

    .strength-seg {
      flex: 1;
      background: rgba(255, 255, 255, 0.1);
      border-radius: var(--radius-full);
      transition: background 0.3s ease;
    }

    .strength-label {
      font-size: 0.72rem;
      color: var(--text-subtle);
      font-weight: 500;
    }

    .extra-options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      font-size: 0.82rem;
    }

    .remember-check {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      color: var(--text-muted);
      user-select: none;
      min-height: 24px;
    }

    .remember-check input {
      display: none;
    }

    .box-mark {
      width: 18px;
      height: 18px;
      border-radius: 5px;
      border: 1px solid var(--input-border);
      background: var(--input-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }

    .remember-check input:checked + .box-mark {
      background: #6366f1;
      border-color: #818cf8;
    }

    .box-mark svg {
      width: 12px;
      height: 12px;
      stroke: #fff;
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0;
      transform: scale(0.5);
      transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .remember-check input:checked + .box-mark svg {
      opacity: 1;
      transform: scale(1);
    }

    .forgot-link {
      color: #818cf8;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.2s ease;
      padding: 4px 0;
    }

    .btn-main {
      width: 100%;
      height: 50px;
      background: var(--accent-gradient);
      border: none;
      border-radius: var(--radius-md);
      color: white;
      font-size: 0.98rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 4px 18px var(--accent-glow);
      transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.2s ease;
      -webkit-appearance: none;
    }

    .btn-main:active {
      transform: scale(0.98);
      box-shadow: 0 2px 10px var(--accent-glow);
    }

    .btn-main svg {
      width: 18px;
      height: 18px;
      transition: transform 0.2s ease;
    }

    .btn-main:hover svg {
      transform: translateX(3px);
    }

    /* Social Section */
    .or-divider {
      display: flex;
      align-items: center;
      margin: 20px 0;
      color: var(--text-subtle);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .or-divider::before,
    .or-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--input-border);
    }

    .or-divider span {
      padding: 0 12px;
    }

    .social-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 18px;
    }

    .btn-social {
      height: 46px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: rgba(22, 29, 44, 0.6);
      border: 1px solid var(--input-border);
      border-radius: var(--radius-md);
      color: var(--text-main);
      font-size: 0.86rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s ease, border-color 0.2s ease, transform 0.15s ease;
    }

    .btn-social:active {
      transform: scale(0.97);
      background: rgba(30, 41, 59, 0.8);
    }

    .btn-social svg {
      width: 17px;
      height: 17px;
    }

    .terms-text {
      font-size: 0.78rem;
      color: var(--text-subtle);
      line-height: 1.4;
      text-align: center;
      margin-top: 14px;
    }

    .terms-text a {
      color: #818cf8;
      text-decoration: none;
    }

    /* Toast System */
    .toast-pill {
      position: fixed;
      bottom: max(24px, env(safe-area-inset-bottom, 24px));
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: rgba(15, 22, 36, 0.96);
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      padding: 12px 20px;
      border-radius: var(--radius-full);
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.6);
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 2000;
      opacity: 0;
      pointer-events: none;
      max-width: 90vw;
    }

    .toast-badge {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .toast-msg {
      font-size: 0.86rem;
      font-weight: 500;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Mobile Small Screen Fine-Tuning */
    @media (max-width: 440px) {
      .auth-card {
        padding: 26px 18px;
        border-radius: 20px;
      }
      .form-title {
        font-size: 1.35rem;
      }
      .social-actions {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <!-- Dedicated Mobile GSAP Preloader -->
  <div class="preloader" id="preloader">
    <div class="loader-brand">
      <div class="loader-icon-wrap" id="loaderIcon">
        <div class="loader-pulse-ring" id="pulseRing"></div>
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" width="30" height="30">
          <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
        </svg>
      </div>
      <span class="loader-title" id="loaderTitle">Nexus Portal</span>
      <div class="loader-bar-container">
        <div class="loader-bar-fill" id="loaderFill"></div>
      </div>
      <span class="loader-status" id="loaderStatus">Initializing</span>
    </div>
  </div>

  <!-- Ambient Atmosphere -->
  <div class="ambient-bg">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
  </div>
  <div class="grid-pattern"></div>

  <!-- Core Authentication Shell -->
  <div class="auth-container" id="authContainer">
    <div class="auth-card" id="authCard">
      <div class="card-top-glow"></div>

      <!-- App Header Icon -->
      <div class="brand-header app-stagger">
        <div class="brand-avatar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
          </svg>
        </div>
        <span class="brand-name">Nexus Portal</span>
      </div>

      <!-- Pill Tab Switcher -->
      <div class="toggle-nav app-stagger" id="toggleNav">
        <div class="toggle-pill" id="togglePill"></div>
        <button type="button" class="toggle-btn active" id="btnTabSignin" onclick="switchMode('signin')">Sign In</button>
        <button type="button" class="toggle-btn" id="btnTabSignup" onclick="switchMode('signup')">Create Account</button>
      </div>

      <!-- Form Viewport -->
      <div class="forms-wrapper">
        
        <!-- ================= SIGN IN VIEW ================= -->
        <form class="form-view" id="signinForm" onsubmit="handleAuthSubmit(event, 'signin')">
          <div class="form-header morph-item">
            <h2 class="form-title">Welcome back</h2>
            <p class="form-subtitle">Enter your credentials to continue</p>
          </div>

          <div class="input-group morph-item">
            <label class="input-label" for="loginEmail">Email</label>
            <div class="input-field-wrap">
              <input type="email" id="loginEmail" class="app-input" placeholder="name@company.com" required autocomplete="email">
              <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke-width="2">
                <rect width="20" height="16" x="2" y="4" rx="2"/>
                <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
              </svg>
            </div>
          </div>

          <div class="input-group morph-item">
            <label class="input-label" for="loginPassword">Password</label>
            <div class="input-field-wrap">
              <input type="password" id="loginPassword" class="app-input" placeholder="••••••••••••" required autocomplete="current-password">
              <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke-width="2">
                <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
              <button type="button" class="eye-btn" onclick="togglePassword('loginPassword', this)" aria-label="Toggle password view">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
          </div>

          <div class="extra-options morph-item">
            <label class="remember-check">
              <input type="checkbox" id="rememberMe" checked>
              <span class="box-mark">
                <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
              </span>
              Remember me
            </label>
            <a href="javascript:void(0)" class="forgot-link" onclick="notify('Reset instructions sent to your email', 'success')">Forgot pass?</a>
          </div>

          <button type="submit" class="btn-main morph-item" id="btnSigninSubmit">
            <span>Sign In</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 12h14M12 5l7 7-7 7"/>
            </svg>
          </button>

          <div class="or-divider morph-item">
            <span>or sign in with</span>
          </div>

          <div class="social-actions morph-item">
            <button type="button" class="btn-social" onclick="notify('Signing in with Google...', 'info')">
              <svg viewBox="0 0 24 24">
                <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"/>
                <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"/>
              </svg>
              <span>Google</span>
            </button>
            <button type="button" class="btn-social" onclick="notify('Signing in with Apple...', 'info')">
              <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.37c.65-.79 1.1-1.89.98-3-.97.04-2.12.65-2.8 1.44-.59.68-1.12 1.78-.98 2.86 1.08.08 2.15-.55 2.8-1.3"/>
              </svg>
              <span>Apple</span>
            </button>
          </div>
        </form>

        <!-- ================= CREATE ACCOUNT VIEW ================= -->
        <form class="form-view is-hidden" id="signupForm" onsubmit="handleAuthSubmit(event, 'signup')">
          <div class="form-header morph-item">
            <h2 class="form-title">Create account</h2>
            <p class="form-subtitle">Join us and manage your workspace</p>
          </div>

          <div class="input-group morph-item">
            <label class="input-label" for="regName">Full Name</label>
            <div class="input-field-wrap">
              <input type="text" id="regName" class="app-input" placeholder="Alex Morgan" required autocomplete="name">
              <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke-width="2">
                <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
              </svg>
            </div>
          </div>

          <div class="input-group morph-item">
            <label class="input-label" for="regEmail">Email Address</label>
            <div class="input-field-wrap">
              <input type="email" id="regEmail" class="app-input" placeholder="alex@company.com" required autocomplete="email">
              <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke-width="2">
                <rect width="20" height="16" x="2" y="4" rx="2"/>
                <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
              </svg>
            </div>
          </div>

          <div class="input-group morph-item">
            <label class="input-label" for="regPassword">Create Password</label>
            <div class="input-field-wrap">
              <input type="password" id="regPassword" class="app-input" placeholder="At least 8 characters" required autocomplete="new-password" oninput="evaluatePasswordStrength(this.value)">
              <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke-width="2">
                <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
              <button type="button" class="eye-btn" onclick="togglePassword('regPassword', this)" aria-label="Toggle password view">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
            
            <!-- Password Strength Bar -->
            <div class="strength-meter">
              <div class="strength-bars">
                <div class="strength-seg" id="seg1"></div>
                <div class="strength-seg" id="seg2"></div>
                <div class="strength-seg" id="seg3"></div>
                <div class="strength-seg" id="seg4"></div>
              </div>
              <span class="strength-label" id="strengthText">Password strength</span>
            </div>
          </div>

          <div class="input-group morph-item">
            <label class="input-label" for="regConfirmPassword">Confirm Password</label>
            <div class="input-field-wrap">
              <input type="password" id="regConfirmPassword" class="app-input" placeholder="Repeat your password" required autocomplete="new-password">
              <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke-width="2">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10"/>
              </svg>
              <button type="button" class="eye-btn" onclick="togglePassword('regConfirmPassword', this)" aria-label="Toggle password view">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
          </div>

          <div class="extra-options morph-item">
            <label class="remember-check">
              <input type="checkbox" id="termsCheck" required>
              <span class="box-mark">
                <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
              </span>
              I agree to terms & privacy
            </label>
          </div>

          <button type="submit" class="btn-main morph-item" id="btnSignupSubmit">
            <span>Create Account</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 12h14M12 5l7 7-7 7"/>
            </svg>
          </button>

          <p class="terms-text morph-item">
            Protected with end-to-end hardware encryption.
          </p>
        </form>

      </div>
    </div>
  </div>

  <!-- Toast Notification Pill -->
  <div class="toast-pill" id="toast">
    <div class="toast-badge" id="toastBadge"></div>
    <span class="toast-msg" id="toastMsg">Notification message</span>
  </div>

  <script>
    let activeMode = 'signin';
    let isAnimatingSwitch = false;

    // Smooth Mobile Preloader Animation Sequence
    window.addEventListener('DOMContentLoaded', () => {
      const preloader = document.getElementById('preloader');
      const loaderIcon = document.getElementById('loaderIcon');
      const pulseRing = document.getElementById('pulseRing');
      const loaderFill = document.getElementById('loaderFill');
      const loaderStatus = document.getElementById('loaderStatus');
      const authContainer = document.getElementById('authContainer');
      const appStaggers = document.querySelectorAll('.app-stagger');
      const signinItems = document.querySelectorAll('#signinForm .morph-item');

      const loadTl = gsap.timeline({
        onComplete: () => {
          preloader.style.display = 'none';
        }
      });

      // 1. Initial Icon entry and pulse ring
      loadTl
        .fromTo(loaderIcon, 
          { scale: 0.6, opacity: 0 }, 
          { scale: 1, opacity: 1, duration: 0.6, ease: 'back.out(1.8)' }
        )
        .to(pulseRing, {
          opacity: 0.8,
          scale: 1.4,
          duration: 0.7,
          ease: 'power2.out',
          repeat: 1,
          yoyo: true
        }, "-=0.3")
        // 2. Progress fill
        .to(loaderFill, {
          width: '65%',
          duration: 0.5,
          ease: 'power1.inOut',
          onStart: () => { loaderStatus.textContent = 'Securing session'; }
        }, "-=0.4")
        .to(loaderFill, {
          width: '100%',
          duration: 0.4,
          ease: 'power2.out',
          onStart: () => { loaderStatus.textContent = 'Ready'; }
        })
        // 3. Morph loader into card reveal
        .to(preloader, {
          opacity: 0,
          scale: 1.05,
          duration: 0.45,
          ease: 'power2.inOut'
        })
        // 4. Smoothly reveal the Auth Card (optimized for mobile)
        .set(authContainer, { opacity: 1 }, "-=0.1")
        .fromTo('#authCard', 
          { 
            y: 30, 
            scale: 0.95, 
            opacity: 0 
          }, 
          { 
            y: 0, 
            scale: 1, 
            opacity: 1, 
            duration: 0.65, 
            ease: 'power3.out' 
          }, 
          "-=0.2"
        )
        // 5. Stagger in header & inputs
        .fromTo(appStaggers, 
          { opacity: 0, y: -10 },
          { opacity: 1, y: 0, duration: 0.4, stagger: 0.08, ease: 'power2.out' },
          "-=0.3"
        )
        .fromTo(signinItems, 
          { opacity: 0, y: 15 },
          { opacity: 1, y: 0, duration: 0.45, stagger: 0.04, ease: 'power2.out' },
          "-=0.3"
        );
    });

    // Smooth Mode Switching with GSAP
    function switchMode(target) {
      if (isAnimatingSwitch || target === activeMode) return;
      isAnimatingSwitch = true;

      const toggleNav = document.getElementById('toggleNav');
      const btnTabSignin = document.getElementById('btnTabSignin');
      const btnTabSignup = document.getElementById('btnTabSignup');
      
      const outgoingForm = activeMode === 'signin' ? document.getElementById('signinForm') : document.getElementById('signupForm');
      const incomingForm = target === 'signin' ? document.getElementById('signinForm') : document.getElementById('signupForm');

      const outgoingItems = outgoingForm.querySelectorAll('.morph-item');
      const incomingItems = incomingForm.querySelectorAll('.morph-item');

      // Update Nav pill state
      if (target === 'signup') {
        toggleNav.classList.add('mode-signup');
        btnTabSignup.classList.add('active');
        btnTabSignin.classList.remove('active');
      } else {
        toggleNav.classList.remove('mode-signup');
        btnTabSignin.classList.add('active');
        btnTabSignup.classList.remove('active');
      }

      const dir = target === 'signup' ? -1 : 1;

      // GSAP Timeline for fluid mobile swap
      const switchTl = gsap.timeline({
        onComplete: () => {
          outgoingForm.classList.add('is-hidden');
          activeMode = target;
          isAnimatingSwitch = false;
        }
      });

      // 1. Slide and fade out current form
      switchTl.to(outgoingItems, {
        opacity: 0,
        x: dir * 25,
        duration: 0.22,
        stagger: 0.02,
        ease: 'power2.in'
      });

      // 2. Hide old, reveal new, prepare starting coordinates
      switchTl.call(() => {
        outgoingForm.classList.add('is-hidden');
        incomingForm.classList.remove('is-hidden');
        gsap.set(incomingItems, {
          opacity: 0,
          x: -dir * 25
        });
      });

      // 3. Subtle card compression feel
      switchTl.fromTo('#authCard', 
        { scale: 0.99 },
        { scale: 1, duration: 0.35, ease: 'power2.out' }
      );

      // 4. Stagger in new fields smoothly
      switchTl.to(incomingItems, {
        opacity: 1,
        x: 0,
        duration: 0.38,
        stagger: 0.03,
        ease: 'power3.out'
      }, "-=0.2");
    }

    // Toggle Password Visibility
    function togglePassword(inputId, triggerBtn) {
      const input = document.getElementById(inputId);
      if (!input) return;

      const isPassword = input.type === 'password';
      input.type = isPassword ? 'text' : 'password';

      gsap.fromTo(triggerBtn, 
        { scale: 0.8 }, 
        { scale: 1, duration: 0.25, ease: 'back.out(2)' }
      );

      triggerBtn.innerHTML = isPassword 
        ? `<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/>
            <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/>
            <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/>
            <line x1="2" x2="22" y1="2" y2="22"/>
          </svg>`
        : `<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>`;
    }

    // Interactive Password Strength Evaluation
    function evaluatePasswordStrength(val) {
      const seg1 = document.getElementById('seg1');
      const seg2 = document.getElementById('seg2');
      const seg3 = document.getElementById('seg3');
      const seg4 = document.getElementById('seg4');
      const label = document.getElementById('strengthText');
      const segs = [seg1, seg2, seg3, seg4];

      // Reset
      segs.forEach(s => s.style.background = 'rgba(255, 255, 255, 0.1)');

      if (!val) {
        label.textContent = 'Password strength';
        label.style.color = 'var(--text-subtle)';
        return;
      }

      let score = 0;
      if (val.length >= 8) score++;
      if (/[A-Z]/.test(val) && /[a-z]/.test(val)) score++;
      if (/[0-9]/.test(val)) score++;
      if (/[^A-Za-z0-9]/.test(val)) score++;

      const colors = ['#f43f5e', '#f59e0b', '#3b82f6', '#10b981'];
      const texts = ['Weak', 'Moderate', 'Good', 'Strong'];

      for (let i = 0; i < score; i++) {
        segs[i].style.background = colors[score - 1];
      }

      label.textContent = texts[score - 1] || 'Weak';
      label.style.color = colors[score - 1] || 'var(--text-subtle)';
    }

    // Mobile Toast Notification System
    function notify(text, type = 'info') {
      const toast = document.getElementById('toast');
      const msg = document.getElementById('toastMsg');
      const badge = document.getElementById('toastBadge');

      msg.textContent = text;

      if (type === 'success') {
        badge.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>`;
      } else if (type === 'error') {
        badge.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#f43f5e" stroke-width="3"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>`;
      } else {
        badge.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#818cf8" stroke-width="3"><circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>`;
      }

      gsap.killTweensOf(toast);
      const toastTl = gsap.timeline();
      toastTl.to(toast, {
        y: 0,
        opacity: 1,
        duration: 0.35,
        ease: 'power3.out'
      })
      .to(toast, {
        y: 70,
        opacity: 0,
        duration: 0.3,
        ease: 'power2.in',
        delay: 2.2
      });
    }

    // Form Submission Handler
    function handleAuthSubmit(e, type) {
      e.preventDefault();
      
      if (type === 'signup') {
        const p1 = document.getElementById('regPassword').value;
        const p2 = document.getElementById('regConfirmPassword').value;

        if (p1 !== p2) {
          notify("Passwords don't match!", "error");
          
          // Mobile-friendly soft horizontal vibration shake
          gsap.fromTo('#authCard', 
            { x: -6 }, 
            { x: 6, duration: 0.06, repeat: 5, yoyo: true, ease: 'power1.inOut', onComplete: () => gsap.set('#authCard', { x: 0 }) }
          );
          return;
        }

        notify("Account created successfully!", "success");
      } else {
        notify("Welcome back! Signing in...", "success");
      }
    }

    // Desktop-Only Mouse Motion (Disabled on mobile and touch devices)
    const isTouchDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
    
    if (!isTouchDevice && window.innerWidth > 768) {
      const card = document.getElementById('authCard');
      window.addEventListener('mousemove', (e) => {
        const { clientX, clientY } = e;
        const xOffset = (clientX / window.innerWidth - 0.5) * 8;
        const yOffset = (clientY / window.innerHeight - 0.5) * 8;

        gsap.to(card, {
          rotationY: xOffset,
          rotationX: -yOffset,
          transformPerspective: 1000,
          duration: 0.6,
          ease: 'power1.out'
        });
      });
    }
  </script>
</body>
</html>
